name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --extra queueserver
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy src
      - run: uv run --locked --no-sync mkdocs build --strict

  test:
    # No test touches an instrument. The RE Manager contract tests need redis;
    # OE_REQUIRE_REDIS makes a missing redis fail instead of skipping them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      OE_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install redis
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install redis
          else
            sudo apt-get update && sudo apt-get install -y redis-server
          fi
      - run: uv sync --locked --group test --extra queueserver --extra tiled
      - run: uv run --locked --no-sync pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Distributions hold the templates and nothing unexpected
        run: |
          unzip -Z1 dist/*.whl > wheel.txt
          tar tzf dist/*.tar.gz | sed 's|^[^/]*/||' > sdist.txt
          for f in electrochemistry_bluesky/templates/run.ipynb \
                   electrochemistry_bluesky/templates/view.ipynb \
                   electrochemistry_bluesky/py.typed; do
            grep -qx "$f" wheel.txt || { echo "wheel lacks $f"; exit 1; }
          done
          if grep -E '^(tests|docs|qserver)/' wheel.txt; then echo "wheel holds repo files"; exit 1; fi
          if grep -E '(^|/)\.(venv|git)/|\.(npz|xlsx)$' sdist.txt; then echo "unexpected sdist files"; exit 1; fi
      - name: The wheel runs from outside the source tree
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl  # the device from PyPI
          cp qserver/session-simulator.toml "$RUNNER_TEMP/session.toml"
          cd "$RUNNER_TEMP"
          sed -i "s|^data_dir = .*|data_dir = \"$RUNNER_TEMP/data\"|" session.toml
          wheel/bin/oe-template runs.xlsx
          wheel/bin/oe-validate runs.xlsx --session session.toml
          wheel/bin/oe-new-viewer data
          test -f data/viewer.ipynb

  # Releases (CONTRIBUTING.md), on main once the checks pass. A push that sets
  # a new __version__ (a merged release PR) is tagged, gets a GitHub release
  # and, with the repository variable PYPI_PUBLISH = true, goes to PyPI. Any
  # other push opens or updates the release PR if there is anything to release.
  tag:
    needs: [lint, test, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}  # a re-run tags the commit that set the version
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version() { python3 -c 'import re, sys; print(re.search(r"__version__ = \"([^\"]+)\"", sys.stdin.read()).group(1))'; }
          VERSION=$(version < src/electrochemistry_bluesky/__init__.py)
          PREVIOUS=$(git show HEAD^1:src/electrochemistry_bluesky/__init__.py | version)
          TAG="v$VERSION"
          if [ "$VERSION" = "0.0.0" ] || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Nothing to tag ($TAG)."
            exit 0
          fi
          if [ "$PREVIOUS" = "$VERSION" ]; then
            echo "::error::$TAG is not tagged, but this commit did not set it: re-run the release of the commit that did."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          python3 - "$VERSION" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          text = open("CHANGELOG.md").read()
          section = re.search(rf"^## v{re.escape(sys.argv[1])}\b.*?$(.*?)(?=^## v|\Z)", text, re.M | re.S)
          print(section.group(1).strip() if section else "See CHANGELOG.md.")
          PY
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tag]
    if: needs.tag.outputs.tag != '' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/electrochemistry-bluesky/
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-pr:
    needs: [tag]
    if: needs.tag.outputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write  # to start CI on the release branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@v6
      - id: next
        run: |
          set -eu
          psr() { uvx --from python-semantic-release==10.7.0 semantic-release "$@"; }
          NEXT=$(psr --noop version --print)
          LAST=$(psr version --print-last-released 2>/dev/null || true)
          echo "next=$NEXT, last released=${LAST:-none}"
          if [ -z "$NEXT" ] || [ "$NEXT" = "$LAST" ]; then
            echo "Nothing to release."
            exit 0
          fi
          psr version --no-commit --no-tag --no-push --no-vcs-release --skip-build
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.version != ''
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/next
          delete-branch: true
          commit-message: "chore(release): v${{ steps.next.outputs.version }}"
          title: "chore(release): v${{ steps.next.outputs.version }}"
          body: |
            Prepared by python-semantic-release: `__version__` and CHANGELOG.md.
            Edit the changelog on this branch if needed. Merging tags
            v${{ steps.next.outputs.version }} and creates the GitHub release
            (and publishes to PyPI when PYPI_PUBLISH is true).

            Checks run from a CI run this workflow starts on the release branch
            (a PR opened with the workflow token starts none by itself). If they
            are missing, run CI on release/next from the Actions tab.
      # GitHub starts no workflow for a PR opened with the workflow token, but a
      # workflow_dispatch run is allowed; its checks attach to the PR's commit.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref release/next
